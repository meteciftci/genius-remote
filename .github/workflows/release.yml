name: Release
run-name: "release: ${{ github.ref_name }}"

# Push a tag such as v1.1.0 to build a Universal, ad-hoc signed app and publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" GeniusRemote/Info.plist)
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $PLIST_VERSION"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project GeniusRemote.xcodeproj -scheme GeniusRemote -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          lipo -archs build/Build/Products/Release/GeniusRemote.app/Contents/MacOS/GeniusRemote

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/GeniusRemote.app "GeniusRemote-${GITHUB_REF_NAME#v}.zip"

      # Signs the zip with the Sparkle key (secret SPARKLE_PRIVATE_KEY) and writes appcast.xml, which
      # installed apps read from the latest release.
      - name: Create appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set; installed apps could not verify this update."
            exit 1
          fi
          mkdir updates
          cp "GeniusRemote-${GITHUB_REF_NAME#v}.zip" updates/
          echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            updates

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "GeniusRemote-${GITHUB_REF_NAME#v}.zip" updates/appcast.xml \
            --title "Genius Remote ${GITHUB_REF_NAME#v}" --generate-notes
