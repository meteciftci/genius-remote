name: GeniusRemote
options:
  bundleIdPrefix: com.meteciftci
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

# Signing lives in Config/Signing.xcconfig (+ optional, untracked Config/Local.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  GeniusRemote:
    type: application
    platform: macOS
    sources:
      - path: GeniusRemote
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: GeniusRemote/Info.plist
      properties:
        CFBundleDisplayName: Genius Remote
        NSAppleEventsUsageDescription: Genius Remote opens SSH connections in a new iTerm2 window.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        SUFeedURL: https://github.com/meteciftci/genius-remote/releases/latest/download/appcast.xml
        SUPublicEDKey: 3GgwiMmyBS2nYOtpsOgql2b2pCAce/JR5sDb7oqdxWY=
        SUEnableAutomaticChecks: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Mete Çiftçi"
        CFBundleLocalizations: [en, tr]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.meteciftci.geniusremote.backup
            UTTypeDescription: Genius Remote Backup
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [geniusremote]
        CFBundleURLTypes:
          - CFBundleURLName: com.meteciftci.GeniusRemote.connect
            CFBundleURLSchemes: [geniusremote]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Genius Remote Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.meteciftci.geniusremote.backup]
    entitlements:
      path: GeniusRemote/GeniusRemote.entitlements
      properties:
        # Lets the hardened runtime send Apple Events, used to open SSH sessions in iTerm2.
        com.apple.security.automation.apple-events: true
        # Sparkle is signed by its own build, and the app is ad-hoc signed, so macOS would
        # refuse to load the framework under library validation.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteciftci.GeniusRemote
        PRODUCT_NAME: GeniusRemote
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  GeniusRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GeniusRemoteTests
    dependencies:
      - target: GeniusRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteciftci.GeniusRemoteTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GeniusRemote.app/Contents/MacOS/GeniusRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GeniusRemote:
    build:
      targets:
        GeniusRemote: all
        GeniusRemoteTests: [test]
    test:
      targets:
        - GeniusRemoteTests
